name: Build and verify transport

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user python3
      - name: Verify recorded binaries
        run: sha256sum -c prebuilt/SHA256SUMS
      - name: Build both architectures
        run: bash scripts/build.sh all
      - name: Codec compatibility under ASan and UBSan
        run: bash scripts/test.sh
      - name: Native transport loopback
        run: python3 tests/udp_roundtrip.py --binary dist/linux-x86_64/wgot-server
      - name: ARM64 smoke and transport loopback under QEMU
        run: |
          qemu-aarch64 dist/keenetic-arm64/wgot-client --help
          python3 tests/udp_roundtrip.py --binary dist/keenetic-arm64/wgot-client --runner qemu-aarch64
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: transport-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
